name: Update Bitcoin Transfer Price

on:
  schedule:
    - cron: '20 0 * * *'  # Daily at 00:20 UTC
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute transfer price
        run: |
          python3 << 'PYEOF'
          import json
          from urllib.request import urlopen
          from datetime import datetime, timezone, date

          GENESIS = date(2009, 1, 3)

          # ── Load full CDD history from repo file ─────────────────────────
          # btc_cdd_array.json: [{d: "YYYY-MM-DD", cdd: float}, ...]
          # Covers 2009-01-03 through the most recent date in the file.
          with open('btc_cdd_array.json') as f:
              raw = json.load(f)

          cdd_map = {}
          for row in raw:
              d   = row.get('d', '')
              cdd = float(row.get('cdd') or 0)
              if d:
                  cdd_map[d] = cdd

          dates_cdd = sorted(cdd_map)
          print(f'CDD history: {len(cdd_map)} dates  ({dates_cdd[0]} → {dates_cdd[-1]})')

          # ── CoinMetrics community: daily price + supply + MVRV ───────────
          # PriceUSD — daily BTC/USD close price (same source used across the app)
          # SplyCur  — circulating supply
          # CapMVRVCur — MVRV ratio (used to derive realized price)
          def fetch_cm():
              base = ('https://community-api.coinmetrics.io/v4/timeseries/asset-metrics'
                      '?assets=btc&metrics=PriceUSD,SplyCur,CapMVRVCur'
                      '&frequency=1d&start_time=2010-01-01&page_size=10000')
              rows = []
              url  = base
              while url:
                  with urlopen(url, timeout=60) as r:
                      body = json.loads(r.read().decode())
                  rows.extend(body.get('data', []))
                  url = body.get('next_page_url')
              result = {}
              for row in rows:
                  d     = row.get('time', '')[:10]
                  price = float(row.get('PriceUSD')   or 0)
                  sply  = float(row.get('SplyCur')    or 0)
                  mvrv  = float(row.get('CapMVRVCur') or 0)
                  if d and price > 0 and sply > 0 and mvrv > 0:
                      result[d] = {'price': price, 'sply': sply, 'mvrv': mvrv}
              dates_cm = sorted(result)
              print(f'CoinMetrics: {len(result)} dates  ({dates_cm[0]} → {dates_cm[-1]})')
              return result

          cm_map = fetch_cm()

          # ── Compute transfer price ───────────────────────────────────────
          # Iterate every date that has CDD data, accumulate the price-weighted
          # cumulative even when CoinMetrics data is absent (early BTC, no price →
          # contribution is zero anyway).  Emit a result row only when CM data exists.
          #
          # Transfer Price[t] = Σ_{genesis → t}(CDD_d × Price_d) / SplyCur[t] / Age[t]

          all_dates     = sorted(set(list(cdd_map.keys()) + list(cm_map.keys())))
          cum_cdd = 0.0
          result  = []

          for d in all_dates:
              cdd = cdd_map.get(d, 0.0)
              cm  = cm_map.get(d)

              cum_cdd += cdd

              if not cm:
                  continue   # no price/supply data for this date — skip output row

              d_date   = date.fromisoformat(d)
              age_days = (d_date - GENESIS).days
              if age_days <= 0 or cm['sply'] <= 0:
                  continue

              transfer_price = cum_cdd / cm['sply'] / age_days
              realized_price = cm['price'] / cm['mvrv']

              unix_ts = int(datetime(d_date.year, d_date.month, d_date.day,
                                     tzinfo=timezone.utc).timestamp())
              result.append({
                  'd':             d,
                  'unixTs':        str(unix_ts),
                  'price':         round(cm['price'],     2),
                  'realizedPrice': round(realized_price,  2),
                  'transferPrice': round(transfer_price,  2),
              })

          print(f'Computed {len(result)} records')
          if result:
              for r in result[-5:]:
                  print(f"  {r['d']}  price={r['price']}  "
                        f"realized={r['realizedPrice']}  transfer={r['transferPrice']}")

          with open('transfer-price.json', 'w') as f:
              json.dump(result, f, separators=(',', ':'))
          print('Saved transfer-price.json')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer-price.json
          git diff --staged --quiet || git commit -m "Update transfer price $(date -u +%Y-%m-%d)"
          git push
