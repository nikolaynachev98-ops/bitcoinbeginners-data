name: Update Bitcoin Transfer Price

on:
  schedule:
    - cron: '1 0 * * *'  # Daily at 00:01 UTC (03:01 AM Bulgaria/EEST)
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Append new transfer price rows
        env:
          BGEOMETRICS_TOKEN: ${{ secrets.BGEOMETRICS_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import json, os
          from urllib.request import Request, urlopen
          from urllib.parse import urlencode
          from datetime import datetime, timezone, date, timedelta

          TOKEN   = os.environ.get('BGEOMETRICS_TOKEN', '')
          GENESIS = date(2009, 1, 3)

          # ── Load existing transfer-price.json ────────────────────────────
          with open('transfer-price.json') as f:
              existing = json.load(f)

          last      = existing[-1]
          last_date = last['d']
          today     = datetime.now(timezone.utc).date()
          yesterday = (today - timedelta(days=1)).isoformat()

          print(f'Last entry: {last_date}  |  Yesterday: {yesterday}')

          if last_date >= yesterday:
              print('Already up to date — nothing to append')
              exit(0)

          # ── Reconstruct cumulative Σ(CDD × price) from last entry ────────
          # transferPrice = cum_cdd_value / sply / age_days
          # → cum_cdd_value = transferPrice × sply × age_days
          #
          # If a previous run stored cumCddValue directly, use it.
          # Otherwise fetch SplyCur for last_date from CoinMetrics once.
          if 'cumCddValue' in last:
              cum_cdd_value = last['cumCddValue']
              print(f'Seeding from stored cumCddValue: {cum_cdd_value:.2f}')
          else:
              last_d    = date.fromisoformat(last_date)
              last_age  = (last_d - GENESIS).days
              sply_url  = ('https://community-api.coinmetrics.io/v4/timeseries/asset-metrics'
                           '?assets=btc&metrics=SplyCur'
                           f'&frequency=1d&start_time={last_date}&end_time={last_date}&page_size=1')
              with urlopen(sply_url, timeout=30) as r:
                  sply_body = json.loads(r.read().decode())
              last_sply = float(sply_body['data'][0]['SplyCur'])
              cum_cdd_value = last['transferPrice'] * last_sply * last_age
              print(f'Reconstructed cumCddValue from last entry: {cum_cdd_value:.2f}')

          # ── Fetch new CDD rows from BGeometrics ──────────────────────────
          # /v1/cdd?startday=...&endday=...  returns daily CDD values
          next_day = (date.fromisoformat(last_date) + timedelta(days=1)).isoformat()
          cdd_url  = 'https://api.bitcoin-data.com/v1/cdd?' + urlencode({
              'startday': next_day, 'endday': yesterday, 'page': 1, 'size': 100
          })
          req = Request(cdd_url)
          if TOKEN:
              req.add_header('Authorization', 'Bearer ' + TOKEN)
          with urlopen(req, timeout=30) as r:
              cdd_body = json.loads(r.read().decode())
          cdd_records = (cdd_body if isinstance(cdd_body, list)
                         else cdd_body.get('_embedded', {}).get('cddList', []))
          cdd_map = {row['d']: float(row.get('cdd') or 0) for row in cdd_records if row.get('d')}
          print(f'BGeometrics CDD: {len(cdd_map)} new dates  ({next_day} → {yesterday})')

          # ── Fetch matching CoinMetrics rows ──────────────────────────────
          cm_url = ('https://community-api.coinmetrics.io/v4/timeseries/asset-metrics'
                    '?assets=btc&metrics=PriceUSD,SplyCur,CapMVRVCur'
                    f'&frequency=1d&start_time={next_day}&end_time={yesterday}&page_size=100')
          with urlopen(cm_url, timeout=30) as r:
              cm_body = json.loads(r.read().decode())
          cm_map = {}
          for row in cm_body.get('data', []):
              d     = row.get('time', '')[:10]
              price = float(row.get('PriceUSD')   or 0)
              sply  = float(row.get('SplyCur')    or 0)
              mvrv  = float(row.get('CapMVRVCur') or 0)
              if d and price > 0 and sply > 0 and mvrv > 0:
                  cm_map[d] = {'price': price, 'sply': sply, 'mvrv': mvrv}
          print(f'CoinMetrics: {len(cm_map)} new dates')

          # ── Compute and append new rows ──────────────────────────────────
          new_rows = []
          for d in sorted(set(cdd_map) & set(cm_map)):
              cdd = cdd_map[d]
              cm  = cm_map[d]

              cum_cdd_value += cdd * cm['price']

              d_date   = date.fromisoformat(d)
              age_days = (d_date - GENESIS).days
              if age_days <= 0:
                  continue

              transfer_price = cum_cdd_value / cm['sply'] / age_days
              realized_price = cm['price'] / cm['mvrv']
              unix_ts        = int(datetime(d_date.year, d_date.month, d_date.day,
                                            tzinfo=timezone.utc).timestamp())
              new_rows.append({
                  'd':             d,
                  'unixTs':        str(unix_ts),
                  'price':         round(cm['price'],     2),
                  'realizedPrice': round(realized_price,  2),
                  'transferPrice': round(transfer_price,  2),
                  'cumCddValue':   round(cum_cdd_value,   4),
              })

          if not new_rows:
              print('No new rows to append (CDD or CoinMetrics data not yet available)')
              exit(0)

          existing.extend(new_rows)

          with open('transfer-price.json', 'w') as f:
              json.dump(existing, f, separators=(',', ':'))

          print(f'Appended {len(new_rows)} new rows:')
          for r in new_rows:
              print(f"  {r['d']}  price={r['price']}  "
                    f"realized={r['realizedPrice']}  transfer={r['transferPrice']}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add transfer-price.json
          git diff --staged --quiet || git commit -m "Update transfer price $(date -u +%Y-%m-%d)"
          git push
