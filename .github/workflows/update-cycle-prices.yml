name: Update Bitcoin Cycle Prices

on:
  schedule:
    - cron: '15 0 * * *'  # Daily at 00:15 UTC
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Compute cycle prices
        env:
          BLOCKCHAIR_KEY: ${{ secrets.BLOCKCHAIR_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, time, os
          from urllib.request import urlopen
          from urllib.error import HTTPError
          from datetime import datetime, timezone, timedelta

          BLOCKCHAIR_KEY = os.environ.get('BLOCKCHAIR_KEY', '').strip()

          # ── CoinMetrics community: PriceUSD + SplyCur + CapMVRVCur ─────────
          def fetch_cm():
              base = ('https://community-api.coinmetrics.io/v4/timeseries/asset-metrics'
                      '?assets=btc&metrics=PriceUSD,SplyCur,CapMVRVCur'
                      '&frequency=1d&start_time=2010-01-01&page_size=10000')
              rows = []
              url = base
              while url:
                  with urlopen(url, timeout=60) as r:
                      body = json.loads(r.read().decode())
                  rows.extend(body.get('data', []))
                  url = body.get('next_page_url')
              print(f'CoinMetrics: {len(rows)} rows')
              result = {}
              for row in rows:
                  d     = row.get('time', '')[:10]
                  price = float(row.get('PriceUSD')   or 0)
                  sply  = float(row.get('SplyCur')    or 0)
                  mvrv  = float(row.get('CapMVRVCur') or 0)
                  if d and price > 0 and sply > 0 and mvrv > 0:
                      result[d] = {'price': price, 'sply': sply, 'mvrv': mvrv}
              return result

          # ── Blockchair: daily CDD via block aggregation ───────────────────
          # Requires BLOCKCHAIR_KEY secret. Free keys available at blockchair.com/api/plans
          def fetch_blockchair_cdd(start='2010-01-01'):
              if not BLOCKCHAIR_KEY:
                  print('No BLOCKCHAIR_KEY secret — skipping Blockchair fetch')
                  return None
              cdd_by_date = {}
              today   = datetime.now(timezone.utc).strftime('%Y-%m-%d')
              current = datetime.strptime(start, '%Y-%m-%d')
              end_dt  = datetime.strptime(today,  '%Y-%m-%d')
              step    = timedelta(days=399)
              page    = 0
              while current <= end_dt:
                  chunk_end = min(current + step, end_dt)
                  url = ('https://api.blockchair.com/bitcoin/blocks'
                         '?a=date,sum(cdd_total)'
                         '&q=time(' + current.strftime('%Y-%m-%d') + '..'
                                    + chunk_end.strftime('%Y-%m-%d') + ')'
                         '&s=date(asc)&limit=400'
                         '&key=' + BLOCKCHAIR_KEY)
                  try:
                      with urlopen(url, timeout=30) as r:
                          body = json.loads(r.read().decode())
                      rows = body.get('data', [])
                      for row in rows:
                          d   = row.get('date', '')
                          cdd = float(row.get('sum(cdd_total)') or 0)
                          if d:
                              cdd_by_date[d] = cdd
                      page += 1
                      print(f'Blockchair page {page}: {len(rows)} rows '
                            f'({current.strftime("%Y-%m-%d")} .. {chunk_end.strftime("%Y-%m-%d")})')
                      time.sleep(0.3)
                  except HTTPError as e:
                      print(f'Blockchair HTTP {e.code}: {e}')
                      return None
                  except Exception as e:
                      print(f'Blockchair error: {e}')
                      return None
                  current = chunk_end + timedelta(days=1)
              print(f'Blockchair CDD total: {len(cdd_by_date)} dates')
              return cdd_by_date

          # ── Fetch ────────────────────────────────────────────────────────
          cm_map  = fetch_cm()
          cdd_map = fetch_blockchair_cdd()
          use_cdd = cdd_map is not None and len(cdd_map) > 100

          if use_cdd:
              print(f'Using Blockchair CDD ({len(cdd_map)} dates)')
          else:
              print('Using issuance-weighted approximation (transfer price will be ~3x too low)')

          # ── Compute ──────────────────────────────────────────────────────
          dates  = sorted(cm_map.keys())
          result = []

          if use_cdd:
              cum_cdd_value = 0.0
              cum_cdd       = 0.0
              for d in dates:
                  cm  = cm_map[d]
                  cdd = float(cdd_map.get(d) or 0)
                  cum_cdd_value += cdd * cm['price']
                  cum_cdd       += cdd
                  if cum_cdd <= 0:
                      continue
                  transfer_price = cum_cdd_value / cum_cdd
                  terminal_price = transfer_price * 21
                  realized_price = cm['price'] / cm['mvrv']
                  balanced_price = realized_price - transfer_price
                  unix_ts = int(datetime.strptime(d, '%Y-%m-%d')
                                .replace(tzinfo=timezone.utc).timestamp())
                  result.append({
                      'd':             d,
                      'unixTs':        str(unix_ts),
                      'price':         round(cm['price'],     2),
                      'realizedPrice': round(realized_price,  2),
                      'transferPrice': round(transfer_price,  2),
                      'terminalPrice': round(terminal_price,  2),
                      'balancedPrice': round(balanced_price,  2),
                  })
          else:
              cum_issuance_value = 0.0
              prev_sply          = None
              for d in dates:
                  cm   = cm_map[d]
                  sply = cm['sply']
                  daily_issuance = (sply - prev_sply) if prev_sply is not None else sply
                  if daily_issuance < 0:
                      daily_issuance = 0
                  cum_issuance_value += daily_issuance * cm['price']
                  prev_sply = sply
                  transfer_price = cum_issuance_value / sply
                  terminal_price = transfer_price * 21
                  realized_price = cm['price'] / cm['mvrv']
                  balanced_price = realized_price - transfer_price
                  unix_ts = int(datetime.strptime(d, '%Y-%m-%d')
                                .replace(tzinfo=timezone.utc).timestamp())
                  result.append({
                      'd':             d,
                      'unixTs':        str(unix_ts),
                      'price':         round(cm['price'],     2),
                      'realizedPrice': round(realized_price,  2),
                      'transferPrice': round(transfer_price,  2),
                      'terminalPrice': round(terminal_price,  2),
                      'balancedPrice': round(balanced_price,  2),
                  })

          print(f'Computed {len(result)} records')
          if result:
              for r in result[-5:]:
                  print(f"  {r['d']}  price={r['price']}  realized={r['realizedPrice']}  "
                        f"transfer={r['transferPrice']}  terminal={r['terminalPrice']}  "
                        f"balanced={r['balancedPrice']}")

          with open('cycle-prices.json', 'w') as f:
              json.dump(result, f, separators=(',', ':'))
          print('Saved cycle-prices.json')
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cycle-prices.json
          git diff --staged --quiet || git commit -m "Update cycle prices $(date -u +%Y-%m-%d)"
          git push
